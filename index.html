<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 지역분석 보고서 어시스턴트</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900">
  <main class="min-h-screen flex items-center justify-center p-6">
    <section class="max-w-3xl w-full bg-white rounded-2xl shadow-xl p-8">
      <p class="text-sm font-semibold text-blue-600 mb-2">AI CHALLENGE</p>
      <h1 class="text-3xl font-bold mb-4">
        바이브 코딩으로 완성하는 보고서 혁신
      </h1>
      <p class="text-slate-600 mb-6">
        지역, 뉴스, 부동산 이슈, 현장 조사 변동률, 과거 우수 보고서를 바탕으로
        AI가 보고서 초안을 생성하는 업무 어시스턴트입니다.
      </p>

      <textarea
        class="w-full h-40 border rounded-xl p-4 mb-4"
        placeholder="출장 메모, 지역 이슈, 조사 내용을 자유롭게 입력하세요."
      ></textarea>

      <button class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700">
        보고서 작성
      </button>
    </section>
  </main>
</body>
</html>
