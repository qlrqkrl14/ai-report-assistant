<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AI 보고서 형식 분석 어시스턴트</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-900">
  <main class="min-h-screen p-6">
    <section class="max-w-7xl mx-auto bg-white rounded-2xl shadow-xl p-8">

      <div class="mb-8">
        <p class="text-sm font-bold text-blue-600 mb-2">AI CHALLENGE</p>

        <h1 class="text-3xl md:text-4xl font-bold mb-4">
          바이브 코딩으로 완성하는 보고서 혁신
        </h1>

        <p class="text-slate-600 leading-relaxed">
          과거 우수 보고서의 형식, 문체, 논리 구조를 AI가 분석하고,
          사용자가 입력한 지역·자료·이슈·수치·사례를 그 형식에 맞게 재구성하여
          새로운 보고서 초안과 최적화된 AI 작성 프롬프트를 생성합니다.
        </p>
      </div>

      <div class="grid lg:grid-cols-2 gap-6">

        <!-- 입력 영역 -->
        <div class="space-y-5">

          <div>
            <label class="block font-semibold mb-2">1. 보고서 주제 / 분석 대상</label>
            <input
              id="subjectInput"
              type="text"
              class="w-full border rounded-xl p-3"
              placeholder="예: 경기 남양주시 부동산 시장 동향 / 상가 임대동향 / 토지 거래 동향 / 개발사업 영향 분석"
            />
          </div>

          <div>
            <label class="block font-semibold mb-2">2. 지역 또는 분석 범위</label>
            <input
              id="regionInput"
              type="text"
              class="w-full border rounded-xl p-3"
              placeholder="예: 경기 남양주시 / 인천 미추홀구 / ○○역세권 / ○○산업단지 인근"
            />
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block font-semibold">3. 참고 자료 링크</label>
              <span class="text-xs text-slate-500">최대 5개</span>
            </div>

            <div id="sourceLinksContainer" class="space-y-2"></div>

            <button
              id="addSourceLinkBtn"
              type="button"
              class="mt-2 text-sm font-semibold text-blue-600 hover:text-blue-800 disabled:text-slate-300 disabled:cursor-not-allowed"
            >
              + 참고 자료 링크 추가
            </button>
          </div>

          <div>
            <label class="block font-semibold mb-2">4. 핵심 이슈 / 현장 메모</label>
            <textarea
              id="issueInput"
              class="w-full h-36 border rounded-xl p-3"
              placeholder="예: 교통 호재, 개발사업, 매물 부족, 공실 증가, 임대료 변화, 토지거래 문의 증가, 상권 변화, 현장 탐문 내용 등을 자유롭게 입력"
            ></textarea>
          </div>

          <div>
            <label class="block font-semibold mb-2">5. 수치 자료 / 변동 지표</label>
            <textarea
              id="indicatorInput"
              class="w-full h-28 border rounded-xl p-3"
              placeholder="예: 거래량 25건→10건 / 매물량 7,903건→7,841건 / 임대료 3.3㎡당 12만 원→13만 원 / 공실률 8%→11%"
            ></textarea>
          </div>

          <div>
            <label class="block font-semibold mb-2">6. 주요 사례 / 근거 자료</label>
            <textarea
              id="caseInput"
              class="w-full h-32 border rounded-xl p-3"
              placeholder="예: 아파트 실거래, 상가 임대료 사례, 토지 거래 사례, 공실 사례, 개발사업 사례, 현장 인터뷰 등을 입력"
            ></textarea>
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block font-semibold">7. 과거 보고서 참고 내용</label>
              <span class="text-xs text-slate-500">최대 3개</span>
            </div>

            <div id="sampleReportsContainer" class="space-y-3"></div>

            <button
              id="addSampleReportBtn"
              type="button"
              class="mt-2 text-sm font-semibold text-blue-600 hover:text-blue-800 disabled:text-slate-300 disabled:cursor-not-allowed"
            >
              + 참고 보고서 추가
            </button>
          </div>

          <button
            id="generateBtn"
            class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition"
          >
            보고서 작성
          </button>
        </div>

        <!-- 출력 영역 -->
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <label class="block font-semibold">AI 보고서 초안</label>

            <button
              id="copyPromptBtn"
              type="button"
              class="text-sm font-semibold text-slate-600 hover:text-blue-700 disabled:text-slate-300 disabled:cursor-not-allowed"
              disabled
            >
              AI 변환 프롬프트 복사
            </button>
          </div>

          <div
            id="resultBox"
            class="min-h-[780px] bg-slate-50 border rounded-xl p-5 whitespace-pre-line text-sm leading-relaxed overflow-y-auto"
          >
            왼쪽 내용을 입력한 뒤 [보고서 작성] 버튼을 누르면 결과가 표시됩니다.
          </div>
        </div>

      </div>
    </section>
  </main>

  <script>
    const MAX_SOURCE_LINKS = 5;
    const MAX_SAMPLE_REPORTS = 3;

    const sourceLinksContainer = document.getElementById("sourceLinksContainer");
    const sampleReportsContainer = document.getElementById("sampleReportsContainer");
    const addSourceLinkBtn = document.getElementById("addSourceLinkBtn");
    const addSampleReportBtn = document.getElementById("addSampleReportBtn");
    const generateBtn = document.getElementById("generateBtn");
    const copyPromptBtn = document.getElementById("copyPromptBtn");
    const resultBox = document.getElementById("resultBox");

    let latestPrompt = "";

    function createSourceLinkInput(index) {
      const wrapper = document.createElement("div");
      wrapper.className = "source-link-row flex gap-2 items-start";

      wrapper.innerHTML = `
        <input
          type="text"
          class="source-link-input flex-1 border rounded-xl p-3"
          placeholder="참고 자료 링크 ${index} 입력"
        />

        <button
          type="button"
          class="remove-source-link-btn shrink-0 px-3 py-3 rounded-xl border text-sm font-semibold text-red-600 hover:bg-red-50"
        >
          삭제
        </button>
      `;

      return wrapper;
    }

    function createSampleReportInput(index) {
      const wrapper = document.createElement("div");
      wrapper.className = "sample-report-row space-y-2";

      wrapper.innerHTML = `
        <div class="flex items-center justify-between">
          <p class="sample-report-title text-sm font-semibold text-slate-600">
            참고 보고서 ${index}
          </p>

          <button
            type="button"
            class="remove-sample-report-btn px-3 py-1 rounded-lg border text-sm font-semibold text-red-600 hover:bg-red-50"
          >
            삭제
          </button>
        </div>

        <textarea
          class="sample-report-input w-full h-40 border rounded-xl p-3"
          placeholder="참고 보고서 ${index} 내용을 입력하세요. 목차, 문체, 문단 흐름, 수치 제시 방식, 사례 정리 방식, 결론 도출 방식이 드러나도록 붙여넣으면 좋습니다."
        ></textarea>
      `;

      return wrapper;
    }

    function addSourceLinkInput() {
      const currentCount = sourceLinksContainer.querySelectorAll(".source-link-row").length;

      if (currentCount >= MAX_SOURCE_LINKS) {
        alert("참고 자료 링크는 최대 5개까지 입력할 수 있습니다.");
        return;
      }

      sourceLinksContainer.appendChild(createSourceLinkInput(currentCount + 1));
      refreshDynamicInputs();
    }

    function addSampleReportInput() {
      const currentCount = sampleReportsContainer.querySelectorAll(".sample-report-row").length;

      if (currentCount >= MAX_SAMPLE_REPORTS) {
        alert("참고 보고서는 최대 3개까지 입력할 수 있습니다.");
        return;
      }

      sampleReportsContainer.appendChild(createSampleReportInput(currentCount + 1));
      refreshDynamicInputs();
    }

    function removeSourceLinkInput(button) {
      const rows = sourceLinksContainer.querySelectorAll(".source-link-row");

      if (rows.length <= 1) {
        alert("참고 자료 링크 입력칸은 최소 1개가 필요합니다.");
        return;
      }

      button.closest(".source-link-row").remove();
      refreshDynamicInputs();
    }

    function removeSampleReportInput(button) {
      const rows = sampleReportsContainer.querySelectorAll(".sample-report-row");

      if (rows.length <= 1) {
        alert("참고 보고서 입력칸은 최소 1개가 필요합니다.");
        return;
      }

      button.closest(".sample-report-row").remove();
      refreshDynamicInputs();
    }

    function refreshDynamicInputs() {
      const sourceRows = sourceLinksContainer.querySelectorAll(".source-link-row");
      const sampleRows = sampleReportsContainer.querySelectorAll(".sample-report-row");

      sourceRows.forEach((row, index) => {
        const input = row.querySelector(".source-link-input");
        const removeBtn = row.querySelector(".remove-source-link-btn");

        input.placeholder = `참고 자료 링크 ${index + 1} 입력`;

        if (sourceRows.length === 1) {
          removeBtn.classList.add("hidden");
        } else {
          removeBtn.classList.remove("hidden");
        }
      });

      sampleRows.forEach((row, index) => {
        const title = row.querySelector(".sample-report-title");
        const textarea = row.querySelector(".sample-report-input");
        const removeBtn = row.querySelector(".remove-sample-report-btn");

        title.textContent = `참고 보고서 ${index + 1}`;
        textarea.placeholder = `참고 보고서 ${index + 1} 내용을 입력하세요. 목차, 문체, 문단 흐름, 수치 제시 방식, 사례 정리 방식, 결론 도출 방식이 드러나도록 붙여넣으면 좋습니다.`;

        if (sampleRows.length === 1) {
          removeBtn.classList.add("hidden");
        } else {
          removeBtn.classList.remove("hidden");
        }
      });

      addSourceLinkBtn.disabled = sourceRows.length >= MAX_SOURCE_LINKS;
      addSampleReportBtn.disabled = sampleRows.length >= MAX_SAMPLE_REPORTS;
    }

    function collectValues(selector) {
      return Array.from(document.querySelectorAll(selector))
        .map((element) => element.value.trim())
        .filter((value) => value.length > 0);
    }

    function formatNumberedList(items, emptyMessage) {
      if (!items.length) {
        return emptyMessage;
      }

      return items
        .map((item, index) => `${index + 1}. ${item}`)
        .join("\n");
    }

    function shortenText(text, maxLength) {
      if (text.length <= maxLength) {
        return text;
      }

      return `${text.slice(0, maxLength)}...`;
    }

    function buildReferenceReportAnalysis(sampleReports) {
      if (!sampleReports.length) {
        return `참고 보고서가 입력되지 않았으므로, 입력 자료의 성격에 맞는 기본 보고서 구조를 사용합니다.
단, 보고서 유형을 임의로 특정하지 않고 입력 자료의 성격에 따라 목차를 구성합니다.`;
      }

      return sampleReports
        .map((report, index) => {
          return `[참고 보고서 ${index + 1}]
${shortenText(report, 700)}`;
        })
        .join("\n\n");
    }

    function buildOptimizedPrompt(data) {
      const sourceLinksBlock = formatNumberedList(data.sourceLinks, "입력 없음");
      const sampleReportBlock = data.sampleReports.length
        ? data.sampleReports
            .map((report, index) => `[참고 보고서 ${index + 1}]
${report}`)
            .join("\n\n")
        : "입력 없음";

      return `
[범용 보고서 형식 분석 및 재구성 프롬프트]

당신은 보고서 작성 전문가이자, 과거 보고서의 형식과 논리 구조를 분석하여 새로운 보고서로 재구성하는 AI 업무 어시스턴트입니다.

당신의 임무는 특정 보고서 양식을 미리 정해두는 것이 아닙니다.
주택 매매 보고서, 전월세 동향 보고서, 토지 거래 보고서, 상가 임대동향 보고서, 개발사업 영향 보고서, 시장동향 보고서 등
어떤 유형의 보고서가 들어와도 먼저 참고 보고서의 형식을 분석한 뒤,
입력된 새 자료를 그 형식에 맞게 배치하여 새로운 보고서를 작성해야 합니다.

중요한 비유로 설명하면,
참고 보고서는 '요리법'이고,
입력 자료는 '재료'입니다.
당신은 요리법을 먼저 분석한 뒤, 새 재료를 가장 적절한 순서와 방식으로 조리하여 완성도 높은 새 보고서를 만들어야 합니다.

────────────────────
1. 입력 자료
────────────────────

[보고서 주제 / 분석 대상]
${data.subject || "입력 없음"}

[지역 또는 분석 범위]
${data.region || "입력 없음"}

[참고 자료 링크]
${sourceLinksBlock}

[핵심 이슈 / 현장 메모]
${data.issue || "입력 없음"}

[수치 자료 / 변동 지표]
${data.indicator || "입력 없음"}

[주요 사례 / 근거 자료]
${data.caseData || "입력 없음"}

[과거 보고서 참고 내용]
${sampleReportBlock}

────────────────────
2. 참고 보고서 형식 분석 지시
────────────────────

과거 보고서 참고 내용이 입력된 경우, 먼저 아래 항목을 분석하세요.

1. 보고서의 전체 제목 구조
   - 지역명 또는 분석 대상이 제목에 어떻게 표시되는지 파악합니다.
   - 번호형, 괄호형, 대괄호형, 제목형 등 표현 방식을 확인합니다.

2. 대목차 구조
   - “□”, “■”, “Ⅰ”, “1.”, “[시장동향]” 등 어떤 목차 기호를 쓰는지 파악합니다.
   - 목차가 어떤 순서로 전개되는지 확인합니다.
   - 예: 지역특성 → 시장동향 → 사례 → 종합판단
   - 예: 개요 → 주요 이슈 → 세부 동향 → 리스크 → 향후 전망
   - 예: 임대동향 → 공실현황 → 임차수요 → 사례 → 판단

3. 문단 작성 방식
   - 문단이 “ㅇ”으로 시작하는지, 서술형 문단인지, 불릿형인지 파악합니다.
   - 한 문단의 평균 길이와 정보 밀도를 파악합니다.
   - 사실, 탐문, 판단이 어떤 순서로 배치되는지 확인합니다.

4. 수치 제시 방식
   - 변동률, 거래량, 매물량, 임대료, 공실률, 실거래가, 사례 가격 등을 어떻게 표현하는지 파악합니다.
   - “0.08%→0.14%”, “25건→10건”, “5.0억(8.15)”처럼 변화 전후를 드러내는 방식이 있으면 유지합니다.

5. 사례 제시 방식
   - 주요 사례를 본문에 녹이는지, 별도 하위 항목으로 분리하는지 파악합니다.
   - 단지명, 지번, 면적, 가격, 날짜, 층, 임대료, 공실률, 면담 내용 등 어떤 요소를 사례로 쓰는지 확인합니다.

6. 결론 도출 방식
   - 단순 요약인지, 원인 분석 후 판단을 제시하는지 확인합니다.
   - 향후 전망, 추가 확인 필요사항, 리스크 요인을 포함하는지 파악합니다.

7. 문체 분석
   - “~임”, “~되었음”, “~보임”, “~조사됨”, “~파악됨”, “~판단됨” 등 보고서형 문체를 분석합니다.
   - 참고 보고서의 문체 톤을 유지하되, 문장을 그대로 복사하지 않습니다.

────────────────────
3. 형식 재구성 지시
────────────────────

참고 보고서가 2개 이상 입력된 경우 다음 기준으로 새 형식을 만드세요.

1. 공통적으로 반복되는 우수한 구조는 유지합니다.
2. 한 보고서에만 있더라도 논리적으로 유용한 구조는 반영합니다.
3. 중복되거나 흐름을 방해하는 목차는 통합합니다.
4. 입력 자료와 맞지 않는 목차는 억지로 유지하지 않습니다.
5. 새 보고서 주제에 꼭 필요한 목차가 없다면 보완 목차를 추가합니다.
6. 최종 형식은 참고 보고서의 장점을 혼합한 새로운 보고서 구조여야 합니다.

중요:
- 보고서 유형을 사전에 주택 매매, 전월세, 상가, 토지 등으로 고정하지 마세요.
- 입력 자료와 참고 보고서의 형식을 보고 스스로 적합한 보고서 유형과 목차를 추론하세요.
- 참고 보고서가 주택 보고서 형식이면 주택 보고서처럼, 토지 보고서 형식이면 토지 보고서처럼, 상가 임대 보고서 형식이면 상가 임대 보고서처럼 작성하세요.
- 서로 다른 유형의 참고 보고서가 섞여 있다면, 입력된 새 자료에 가장 적합한 형식을 우선 적용하세요.

────────────────────
4. 입력 자료 배치 지시
────────────────────

새 보고서 작성 시 입력 자료를 다음 기준으로 배치하세요.

1. 보고서 주제 / 분석 대상
   - 제목 또는 첫 문단에 반영합니다.

2. 지역 또는 분석 범위
   - 지역 개황, 분석 범위, 시장 배경 등 적절한 위치에 반영합니다.

3. 참고 자료 링크
   - 기사 내용이 제공되지 않은 경우 링크 내용을 임의로 단정하지 않습니다.
   - “관련 자료로 제시됨”, “추가 확인 필요” 등으로 신중하게 활용합니다.

4. 핵심 이슈 / 현장 메모
   - 참고 보고서의 주요 이슈, 시장동향, 현장 탐문, 분석 배경 항목에 배치합니다.

5. 수치 자료 / 변동 지표
   - 변동률, 거래량, 매물량, 임대료, 공실률, 가격 변화 등 수치가 필요한 문단에 배치합니다.
   - 변화 전후가 있는 경우 화살표 또는 비교 문장으로 표현합니다.

6. 주요 사례 / 근거 자료
   - 참고 보고서의 사례 제시 방식에 맞춰 본문 또는 별도 하위 항목에 배치합니다.
   - 사례가 부족하면 임의로 만들지 말고 “추가 확인 필요”로 표시합니다.

────────────────────
5. 최종 출력 지시
────────────────────

최종 결과물은 아래 순서로 작성하세요.

1. 보고서 제목
2. 참고 보고서에서 추출한 형식을 반영한 본문
3. 입력 자료를 바탕으로 한 분석 내용
4. 주요 사례 또는 근거 자료 정리
5. 종합 판단 또는 향후 검토사항
6. 자료 부족 시 추가 확인 필요사항

단, 위 순서를 반드시 고정하지 말고,
참고 보고서의 형식과 입력 자료의 성격에 맞게 자연스럽게 조정하세요.

────────────────────
6. 작성 원칙
────────────────────

- 문체는 참고 보고서의 톤을 따릅니다.
- 문장은 공공기관 또는 회사 내부 보고서에 어울리는 객관적 문장으로 작성합니다.
- 확인된 사실, 현장 탐문, 분석 판단을 구분합니다.
- 자료가 부족한 부분은 추정하지 말고 “추가 확인 필요”로 표시합니다.
- 입력되지 않은 사례나 수치를 임의로 만들지 않습니다.
- 참고 보고서의 문장을 그대로 복사하지 않고, 형식과 논리만 차용합니다.
- 최종 보고서는 바로 초안으로 활용 가능한 수준으로 작성합니다.
`;
    }

    function buildReport(data, optimizedPrompt) {
      const sourceLinksBlock = formatNumberedList(
        data.sourceLinks,
        "참고 자료 링크가 입력되지 않았습니다."
      );

      const sampleReportAnalysis = buildReferenceReportAnalysis(data.sampleReports);

      return `
[AI 보고서 형식 분석 결과]

1. 보고서 주제 / 분석 대상

${data.subject || "보고서 주제가 입력되지 않았습니다."}

2. 지역 또는 분석 범위

${data.region || "지역 또는 분석 범위가 입력되지 않았습니다."}

3. 참고 자료 링크

${sourceLinksBlock}

4. 입력 자료 요약

핵심 이슈 / 현장 메모:
${data.issue || "입력된 핵심 이슈 또는 현장 메모가 없습니다."}

수치 자료 / 변동 지표:
${data.indicator || "입력된 수치 자료 또는 변동 지표가 없습니다."}

주요 사례 / 근거 자료:
${data.caseData || "입력된 주요 사례 또는 근거 자료가 없습니다."}

5. 참고 보고서 형식 분석 대상

${sampleReportAnalysis}

6. 보고서 작성 방향

입력된 참고 보고서는 단순히 내용을 복사하기 위한 자료가 아니라, 보고서의 형식과 논리 구조를 추출하기 위한 기준 자료입니다.
AI는 참고 보고서의 제목 구성, 대목차, 문단 기호, 수치 제시 방식, 사례 정리 방식, 결론 도출 방식을 먼저 분석해야 합니다.

그다음 입력된 새 자료를 분석된 형식에 맞게 재배치하여 새로운 보고서를 작성해야 합니다.
이 과정에서 보고서 유형을 미리 주택 매매, 전월세, 토지, 상가, 임대동향 등으로 고정해서는 안 됩니다.
참고 보고서와 입력 자료의 성격을 바탕으로 가장 적합한 보고서 유형과 목차를 스스로 추론해야 합니다.

7. 최적화된 AI 변환 프롬프트

${optimizedPrompt}
`;
    }

    function copyTextFallback(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";

      document.body.appendChild(textarea);

      textarea.focus();
      textarea.select();

      try {
        document.execCommand("copy");
        alert("AI 변환 프롬프트가 복사되었습니다.");
      } catch (error) {
        alert("복사에 실패했습니다. 결과창의 프롬프트를 직접 복사해주세요.");
      }

      document.body.removeChild(textarea);
    }

    addSourceLinkBtn.addEventListener("click", addSourceLinkInput);
    addSampleReportBtn.addEventListener("click", addSampleReportInput);

    sourceLinksContainer.addEventListener("click", function (event) {
      if (event.target.classList.contains("remove-source-link-btn")) {
        removeSourceLinkInput(event.target);
      }
    });

    sampleReportsContainer.addEventListener("click", function (event) {
      if (event.target.classList.contains("remove-sample-report-btn")) {
        removeSampleReportInput(event.target);
      }
    });

    generateBtn.addEventListener("click", function () {
      const data = {
        subject: document.getElementById("subjectInput").value.trim(),
        region: document.getElementById("regionInput").value.trim(),
        sourceLinks: collectValues(".source-link-input"),
        issue: document.getElementById("issueInput").value.trim(),
        indicator: document.getElementById("indicatorInput").value.trim(),
        caseData: document.getElementById("caseInput").value.trim(),
        sampleReports: collectValues(".sample-report-input")
      };

      if (!data.subject && !data.region) {
        alert("보고서 주제 또는 지역/분석 범위 중 하나는 입력해주세요.");
        return;
      }

      latestPrompt = buildOptimizedPrompt(data);

      const report = buildReport(data, latestPrompt);

      resultBox.textContent = report;
      copyPromptBtn.disabled = false;
    });

    copyPromptBtn.addEventListener("click", async function () {
      if (!latestPrompt) {
        alert("먼저 보고서를 작성해주세요.");
        return;
      }

      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(latestPrompt);
          alert("AI 변환 프롬프트가 복사되었습니다.");
          return;
        } catch (error) {
          copyTextFallback(latestPrompt);
        }
      } else {
        copyTextFallback(latestPrompt);
      }
    });

    addSourceLinkInput();
    addSampleReportInput();
  </script>
</body>
</html>
