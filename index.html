<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AI 지역분석 보고서 어시스턴트</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 text-slate-900">
  <main class="min-h-screen p-6">
    <section class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl p-8">

      <div class="mb-8">
        <p class="text-sm font-bold text-blue-600 mb-2">AI CHALLENGE</p>

        <h1 class="text-3xl md:text-4xl font-bold mb-4">
          바이브 코딩으로 완성하는 보고서 혁신
        </h1>

        <p class="text-slate-600 leading-relaxed">
          지역, 뉴스, 부동산 이슈, 현장 조사 변동률, 실거래사례, 과거 우수 보고서 형식을 바탕으로
          AI가 지역분석 보고서 초안과 최적화된 보고서 작성 프롬프트를 생성하는 업무 어시스턴트입니다.
        </p>
      </div>

      <div class="grid lg:grid-cols-2 gap-6">

        <!-- 입력 영역 -->
        <div class="space-y-5">

          <div>
            <label class="block font-semibold mb-2">1. 지역</label>
            <input
              id="regionInput"
              type="text"
              class="w-full border rounded-xl p-3"
              placeholder="예: 인천 미추홀구"
            />
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block font-semibold">2. 뉴스 링크</label>
              <span class="text-xs text-slate-500">최대 5개</span>
            </div>

            <div id="newsLinksContainer" class="space-y-2"></div>

            <button
              id="addNewsBtn"
              type="button"
              class="mt-2 text-sm font-semibold text-blue-600 hover:text-blue-800"
            >
              + 뉴스 링크 추가
            </button>
          </div>

          <div>
            <label class="block font-semibold mb-2">3. 부동산 이슈</label>
            <textarea
              id="issueInput"
              class="w-full h-28 border rounded-xl p-3"
              placeholder="지역 부동산 이슈를 입력하세요"
            ></textarea>
          </div>

          <div>
            <label class="block font-semibold mb-2">4. 현장 조사 변동률</label>
            <input
              id="rateInput"
              type="text"
              class="w-full border rounded-xl p-3"
              placeholder="예: 전월 대비 2.3% 상승"
            />
          </div>

          <div>
            <label class="block font-semibold mb-2">5. 실거래사례</label>
            <textarea
              id="realTradeInput"
              class="w-full h-28 border rounded-xl p-3"
              placeholder="예: 다산동 이편한세상자이 / 전용 75㎡ / 5.8억 원 / 8월 15일 거래"
            ></textarea>
          </div>

          <div>
            <div class="flex items-center justify-between mb-2">
              <label class="block font-semibold">6. 과거 보고서 참고 내용</label>
              <span class="text-xs text-slate-500">최대 3개</span>
            </div>

            <div id="sampleReportsContainer" class="space-y-3"></div>

            <button
              id="addSampleReportBtn"
              type="button"
              class="mt-2 text-sm font-semibold text-blue-600 hover:text-blue-800"
            >
              + 참고 보고서 추가
            </button>
          </div>

          <button
            id="generateBtn"
            class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition"
          >
            보고서 작성
          </button>
        </div>

        <!-- 출력 영역 -->
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <label class="block font-semibold">AI 보고서 초안</label>

            <button
              id="copyPromptBtn"
              type="button"
              class="text-sm font-semibold text-slate-600 hover:text-blue-700 disabled:text-slate-300"
              disabled
            >
              AI 변환 프롬프트 복사
            </button>
          </div>

          <div
            id="resultBox"
            class="min-h-[650px] bg-slate-50 border rounded-xl p-5 whitespace-pre-line text-sm leading-relaxed overflow-y-auto"
          >
            왼쪽 내용을 입력한 뒤 [보고서 작성] 버튼을 누르면 결과가 표시됩니다.
          </div>
        </div>

      </div>
    </section>
  </main>

  <script>
    const MAX_NEWS_LINKS = 5;
    const MAX_SAMPLE_REPORTS = 3;

    const newsLinksContainer = document.getElementById("newsLinksContainer");
    const sampleReportsContainer = document.getElementById("sampleReportsContainer");
    const addNewsBtn = document.getElementById("addNewsBtn");
    const addSampleReportBtn = document.getElementById("addSampleReportBtn");
    const generateBtn = document.getElementById("generateBtn");
    const copyPromptBtn = document.getElementById("copyPromptBtn");
    const resultBox = document.getElementById("resultBox");

    let latestPrompt = "";

    function createNewsInput(index) {
      const wrapper = document.createElement("div");

      wrapper.innerHTML = `
        <input
          type="text"
          class="news-link-input w-full border rounded-xl p-3"
          placeholder="뉴스 링크 ${index} 입력"
        />
      `;

      return wrapper;
    }

    function createSampleReportInput(index) {
      const wrapper = document.createElement("div");

      wrapper.innerHTML = `
        <textarea
          class="sample-report-input w-full h-32 border rounded-xl p-3"
          placeholder="참고 보고서 ${index} 내용을 입력하세요. 보고서의 목차, 문체, 논리 전개 방식이 드러나도록 붙여넣으면 좋습니다."
        ></textarea>
      `;

      return wrapper;
    }

    function addNewsInput() {
      const currentCount = newsLinksContainer.querySelectorAll(".news-link-input").length;

      if (currentCount >= MAX_NEWS_LINKS) {
        alert("뉴스 링크는 최대 5개까지 입력할 수 있습니다.");
        return;
      }

      newsLinksContainer.appendChild(createNewsInput(currentCount + 1));
      updateAddButtonState();
    }

    function addSampleReportInput() {
      const currentCount = sampleReportsContainer.querySelectorAll(".sample-report-input").length;

      if (currentCount >= MAX_SAMPLE_REPORTS) {
        alert("참고 보고서는 최대 3개까지 입력할 수 있습니다.");
        return;
      }

      sampleReportsContainer.appendChild(createSampleReportInput(currentCount + 1));
      updateAddButtonState();
    }

    function updateAddButtonState() {
      const newsCount = newsLinksContainer.querySelectorAll(".news-link-input").length;
      const reportCount = sampleReportsContainer.querySelectorAll(".sample-report-input").length;

      addNewsBtn.disabled = newsCount >= MAX_NEWS_LINKS;
      addSampleReportBtn.disabled = reportCount >= MAX_SAMPLE_REPORTS;

      addNewsBtn.classList.toggle("text-slate-300", newsCount >= MAX_NEWS_LINKS);
      addSampleReportBtn.classList.toggle("text-slate-300", reportCount >= MAX_SAMPLE_REPORTS);
    }

    function collectValues(selector) {
      return Array.from(document.querySelectorAll(selector))
        .map((element) => element.value.trim())
        .filter((value) => value.length > 0);
    }

    function formatNumberedList(items, emptyMessage) {
      if (!items.length) {
        return emptyMessage;
      }

      return items
        .map((item, index) => `${index + 1}. ${item}`)
        .join("\n");
    }

    function shortenText(text, maxLength) {
      if (text.length <= maxLength) {
        return text;
      }

      return `${text.slice(0, maxLength)}...`;
    }

    function buildSampleReportSummary(sampleReports) {
      if (!sampleReports.length) {
        return "과거 보고서 참고 내용이 입력되지 않았습니다. 기본 보고서 구조를 적용합니다.";
      }

      const summaries = sampleReports
        .map((report, index) => {
          return `참고 보고서 ${index + 1} 요약 입력:
${shortenText(report, 350)}`;
        })
        .join("\n\n");

      return `입력된 ${sampleReports.length}개 참고 보고서를 형식 분석 대상으로 설정합니다.

분석 방향:
- 각 보고서의 목차 구성 방식을 비교합니다.
- 문단 전개 순서, 근거 제시 방식, 결론 도출 방식을 분석합니다.
- 반복적으로 등장하는 우수한 구조는 유지합니다.
- 중복되거나 논리 흐름을 방해하는 부분은 정리합니다.
- 3개 보고서의 장점을 혼합하여 가장 논리적인 새 보고서 구조로 재구성합니다.

${summaries}`;
    }

    function buildOptimizedPrompt(data) {
      const newsBlock = formatNumberedList(data.newsLinks, "입력 없음");
      const sampleReportBlock = data.sampleReports.length
        ? data.sampleReports
            .map((report, index) => `[참고 보고서 ${index + 1}]
${report}`)
            .join("\n\n")
        : "입력 없음";

      return `
[역할]

당신은 지역 부동산 동향을 분석하는 전문 보고서 작성 어시스턴트입니다.
단순히 문장을 꾸미는 것이 아니라, 입력 자료를 바탕으로 공공기관 또는 회사 내부 보고서 수준의 논리적 분석 보고서를 작성해야 합니다.

[핵심 목표]

아래 입력 자료를 바탕으로 새로운 지역분석 보고서를 작성하세요.
특히 과거 참고 보고서가 여러 개 입력된 경우, 각 보고서의 장점을 분석한 뒤 가장 논리적인 형식으로 재구성하여 새 보고서에 반영하세요.
문장을 그대로 복사하지 말고, 보고서의 구조, 논리 전개 방식, 근거 제시 방식, 결론 방식만 차용하세요.

[입력 자료]

1. 분석 지역
${data.region || "입력 없음"}

2. 관련 뉴스 링크
${newsBlock}

3. 지역 부동산 이슈
${data.issue || "입력 없음"}

4. 현장 조사 변동률
${data.rate || "입력 없음"}

5. 실거래사례
${data.realTrade || "입력 없음"}

6. 과거 보고서 참고 내용
${sampleReportBlock}

[참고 보고서 형식 혼합 지시]

과거 보고서 참고 내용이 1개 이상 입력된 경우 다음 순서로 분석하세요.

1. 각 참고 보고서의 목차와 문단 순서를 파악합니다.
2. 각 보고서가 어떤 방식으로 근거를 제시하고 결론을 도출하는지 분석합니다.
3. 중복되는 형식은 하나로 통합합니다.
4. 논리 흐름이 좋은 구조는 유지합니다.
5. 부족한 부분은 지역 현황, 뉴스, 실거래사례, 현장 조사 변동률이 자연스럽게 연결되도록 보완합니다.
6. 최종적으로 가장 설득력 있는 새 보고서 형식을 설계합니다.

[권장 보고서 구조]

1. 검토 배경
- 보고서 작성 목적과 분석 범위를 설명합니다.
- 해당 지역을 검토해야 하는 이유를 간결하게 제시합니다.

2. 지역 현황
- 지역의 입지, 수요, 공급, 개발 이슈, 생활 인프라, 시장 분위기를 종합합니다.
- 단순 나열이 아니라 시장에 영향을 주는 요인을 중심으로 작성합니다.

3. 주요 뉴스 및 부동산 이슈
- 입력된 뉴스 링크를 근거 자료로 정리합니다.
- 지역 부동산 이슈와 뉴스의 관련성을 설명합니다.
- 이슈가 가격, 거래량, 수요 심리에 어떤 영향을 줄 수 있는지 분석합니다.

4. 현장 조사 변동률 분석
- 입력된 변동률을 기준으로 상승, 하락, 보합 흐름을 해석합니다.
- 변동률의 원인을 현장 분위기, 매수 심리, 개발 기대감, 거래 위축 등과 연결합니다.

5. 실거래사례 검토
- 단지명, 전용면적, 거래금액, 거래일자를 중심으로 실거래사례를 정리합니다.
- 실거래가격과 현장 조사 변동률, 지역 이슈가 서로 일치하는지 검토합니다.
- 일시적 거래 또는 특수 요인이 있을 가능성도 함께 언급합니다.

6. 참고 보고서 형식 재구성
- 입력된 과거 보고서들의 장점을 혼합하여 이번 보고서에 적합한 구성으로 재정리합니다.
- 보고서의 논리 흐름이 자연스럽게 이어지도록 문단 순서를 조정합니다.

7. 종합 판단
- 지역 현황, 뉴스, 이슈, 현장 조사, 실거래사례를 종합해 판단합니다.
- 단기적 시장 흐름과 추가 확인 필요사항을 구분합니다.
- 과장된 표현을 피하고 객관적 보고서 문체로 작성합니다.

[작성 원칙]

- 문체는 객관적이고 공식적인 보고서형 문장으로 작성합니다.
- 확인된 사실과 분석자의 판단을 구분합니다.
- 단순 요약이 아니라 원인과 영향을 연결합니다.
- 입력 자료가 부족한 경우에는 추정하지 말고 추가 확인 필요사항으로 표시합니다.
- 과거 보고서 문장을 그대로 베끼지 말고 형식과 논리만 차용합니다.
- 최종 결과물은 바로 보고서 초안으로 활용할 수 있게 작성합니다.
`;
    }

    function buildReport(data, optimizedPrompt) {
      const newsBlock = formatNumberedList(
        data.newsLinks,
        "관련 뉴스 링크가 입력되지 않았습니다."
      );

      const sampleReportSummary = buildSampleReportSummary(data.sampleReports);

      return `
[${data.region} 지역 부동산 동향 분석 보고서]

1. 검토 배경

본 보고서는 ${data.region} 지역의 최근 부동산 시장 동향과 현장 조사 내용을 종합하여 작성한 초안입니다.
관련 뉴스, 지역 내 주요 이슈, 현장 조사 변동률, 실거래사례, 과거 우수 보고서 형식을 참고하여 지역 시장의 변화 흐름을 파악하는 데 목적이 있습니다.

2. 지역 현황

${data.region} 지역은 최근 부동산 시장의 변동성이 확대되고 있는 지역으로, 거래량, 가격 흐름, 개발 이슈, 생활 인프라 변화 등이 복합적으로 작용하고 있습니다.
특히 현장 조사 결과, 실거래사례, 외부 보도자료를 함께 검토하여 단순한 가격 변화가 아닌 수요 심리와 지역 여건 변화까지 함께 살펴볼 필요가 있습니다.

3. 주요 뉴스 및 부동산 이슈

관련 뉴스:
${newsBlock}

지역 부동산 이슈:
${data.issue || "지역 부동산 이슈가 입력되지 않았습니다."}

위 내용을 종합하면, 해당 지역의 부동산 시장은 단일 요인보다는 지역 개발, 수요 변화, 정책 환경, 현장 체감 분위기 등이 함께 영향을 미치고 있는 것으로 보입니다.
입력된 뉴스 링크는 향후 보고서 작성 시 근거 자료로 활용할 수 있으며, 각 뉴스의 핵심 내용과 지역 시장에 미치는 영향을 추가로 정리하면 보고서의 신뢰도를 높일 수 있습니다.

4. 현장 조사 변동률 분석

입력된 변동률:
${data.rate || "변동률이 입력되지 않았습니다."}

해당 변동률은 현장 조사 과정에서 확인된 시장 분위기를 수치화한 자료로 볼 수 있습니다.
변동률이 상승세를 보이는 경우에는 매수 문의 증가, 개발 기대감, 공급 부족 등의 요인을 검토할 필요가 있습니다.
반대로 하락세를 보이는 경우에는 거래 위축, 금리 부담, 매수 심리 약화, 공급 증가 등의 요인을 함께 분석할 필요가 있습니다.

5. 실거래사례 검토

입력된 실거래사례:
${data.realTrade || "실거래사례가 입력되지 않았습니다."}

해당 실거래사례는 현장 조사 변동률과 실제 거래가격 흐름을 비교하기 위한 참고 자료로 활용할 수 있습니다.
특히 단지명, 전용면적, 거래금액, 거래일자를 함께 검토하면 해당 지역의 체감 시세와 실제 거래 수준 간의 차이를 파악하는 데 도움이 됩니다.
실거래가격이 최근 호가 또는 현장 조사 결과와 유사한 흐름을 보이는 경우 시장 변동성이 실제 거래에 반영되고 있는 것으로 볼 수 있습니다.
반면 차이가 큰 경우에는 일시적 거래, 특수거래, 층·향·상태 등 개별 요인을 추가로 검토할 필요가 있습니다.

6. 참고 보고서 형식 재구성

${sampleReportSummary}

위 참고 보고서들은 단순히 내용을 복사하기 위한 자료가 아니라, 보고서의 목차 구성, 논리 전개 방식, 근거 제시 방식, 결론 도출 방식을 참고하기 위한 자료입니다.

    function copyTextFallback(text) {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        document.execCommand("copy");
        alert("AI 변환 프롬프트가 복사되었습니다.");
      } catch (error) {
        alert("복사에 실패했습니다. 결과창의 프롬프트를 직접 복사해주세요.");
      }

      document.body.removeChild(textarea);
    }

    addNewsBtn.addEventListener("click", addNewsInput);
    addSampleReportBtn.addEventListener("click", addSampleReportInput);

    generateBtn.addEventListener("click", function () {
      const data = {
        region: document.getElementById("regionInput").value.trim(),
        newsLinks: collectValues(".news-link-input"),
        issue: document.getElementById("issueInput").value.trim(),
        rate: document.getElementById("rateInput").value.trim(),
        realTrade: document.getElementById("realTradeInput").value.trim(),
        sampleReports: collectValues(".sample-report-input")
      };

      if (!data.region) {
        alert("지역을 입력해주세요.");
        return;
      }

      latestPrompt = buildOptimizedPrompt(data);

      const report = buildReport(data, latestPrompt);

      resultBox.textContent = report;
      copyPromptBtn.disabled = false;
    });

    copyPromptBtn.addEventListener("click", async function () {
      if (!latestPrompt) {
        alert("먼저 보고서를 작성해주세요.");
        return;
      }

      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(latestPrompt);
          alert("AI 변환 프롬프트가 복사되었습니다.");
          return;
        } catch (error) {
          copyTextFallback(latestPrompt);
        }
      } else {
        copyTextFallback(latestPrompt);
      }
    });

    addNewsInput();
    addSampleReportInput();
  </script>
